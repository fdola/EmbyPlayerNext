name: Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset & Tag
        id: prepare
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          
          # User-friendly APK filename
          APK_FILE="EmbyPlayerNext-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          
          TAG_NAME="v${VERSION_NAME}"
          # If tag already exists on remote, append run number so each push gets its own release
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            TAG_NAME="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_ENV
          echo "apk_file=$APK_FILE" >> $GITHUB_ENV
          
          echo "Prepared $APK_FILE with tag $TAG_NAME"

      - name: Upload Debug APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.tag_name }}-debug
          path: ${{ env.apk_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "EmbyPlayerNext ${{ env.tag_name }} (Build ${{ env.version_code }})"
          body: |
            ### 🚀 EmbyPlayerNext ${{ env.tag_name }} 更新日志

            - **版本 (Version)**: v${{ env.version_name }} (Build ${{ env.version_code }})
            - **构建类型 (Type)**: Debug APK
            - **安装包文件名**: `${{ env.apk_file }}`
            - **适用设备**: Android 手机 / 平板 / Android TV 电视盒子 / 车机全平台自适应

            ---

            ### 🌟 本次更新内容（相比上一版改进）

            #### 1. 系统状态栏智能识别 App 深色背景并显示纯白字体
            - **修复浅色系统模式下状态栏黑字隐形问题**：此前因 `enableEdgeToEdge()` 默认跟随系统黑白昼夜模式，当手机系统处于白天/浅色模式时，系统状态栏字体和图标默认渲染为黑色，导致在 App 深色界面中完全看不清。
            - **全场景多层强化适配**：
              - 在 `MainActivity` 明确指定 `SystemBarStyle.dark`，声明应用顶底栏均为深色背景，系统底层强制渲染纯白色状态栏与导航栏图标；
              - 在 `EmbyPlayerTheme`、页面路由切换（`EmbyApp`）及全屏播放器退出恢复（`PlayerScreen`）多层级注入 `isAppearanceLightStatusBars = false`，保证非播放页面下状态栏时间、电量、通知图标始终呈清晰纯白色。

            #### 2. 服务器与账号管理弹窗缩放精准对齐与横屏自适应宽展
            - **根除弹窗密度二次放大**：修复弹窗多层嵌套导致的缩放因子平方倍过度放大问题，弹窗大小与文字比例与 App 设置中的“界面缩放”精确对齐。
            - **解除系统横屏强制过窄限制**：开启 `usePlatformDefaultWidth = false`，摆脱 Android 系统原生对话框在横屏状态下的强制窄缝限制；横屏下弹窗宽度扩展至可用空间的 88%（上限放宽至 780dp），服务器地址与操作按钮从容平铺展布；
            - **横屏输入布局优化**：横屏状态下将用户名与密码输入框自适应并排显示，节约纵向空间，避免输入时被软键盘遮挡。

            ---

            ### 📋 首个 Release 以来核心功能汇总

            - **高并发解除限流与长连接保活**：解除 OkHttp 默认 5 并发瓶颈，提升至 32 单机/128 全局并发；构建 API、媒体流与图片专属长连接池，极大减少握手延迟。
            - **FastDns 智能解析与 IPv6 防黑洞**：默认优先解析 IPv4 并带内存 TTL 缓存，彻底根治电视机顶盒由于 IPv6 超时引起的 5~10 秒黑洞卡死。
            - **播放倍速记忆与焦点自动锁定**：支持在设置中开启“记忆播放倍速”，每次播放自动套用；调节倍速时焦点框自动精准聚焦当前倍速。
            - **首页继续观看剧集聚合与短播留存**：继续观看以整部剧集聚合展示，点击精准跳转有播放进度的单集；支持十几秒短播进度留存。
            - **4K HEVC 硬件解码看门狗防假死**：重构帧渲染监控看门狗，避免高码率视频加载初期偶发卡顿误报播放失败弹窗。
            - **剧集自动连播**：单集播放完毕后自动进入 5 秒倒计时并无缝跳转下一集，支持一键跳过。
            - **全平台自适应交互**：完美兼容电视大屏横屏遥控器、平板分栏展开与手机单手竖屏触控；支持平滑遥控器滚动与焦点防丢失。
            - **网络传输稳定性与连接池优化**：针对动态宽带与休眠唤醒网络状况优化连接池，彻底消除偶发断流异常。
          files: ${{ env.apk_file }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
